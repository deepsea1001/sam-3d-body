<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MHR70 Skeleton Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a1a;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #888;
            font-size: 12px;
            pointer-events: none;
        }
        #info h1 {
            font-size: 14px;
            color: #ccc;
            margin-bottom: 5px;
        }
        #drop-zone {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #666;
            text-align: center;
            pointer-events: none;
        }
        #drop-zone.hidden {
            display: none;
        }
        #drop-zone h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        #drop-zone p {
            font-size: 14px;
        }
        .drag-over {
            background: #2a2a2a !important;
        }
        #controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #666;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="info">
        <h1>MHR70 Skeleton Viewer</h1>
        <div id="filename"></div>
    </div>
    <div id="drop-zone">
        <h2>Drop JSON file here</h2>
        <p>or use ?file=path/to/skeleton.json</p>
    </div>
    <div id="controls">
        Left-drag: rotate | Scroll: zoom | Right-drag: pan
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls;
        let skeletonGroup = null;
        let headCircles = []; // Store head circles to orient toward camera

        function init() {
            const container = document.getElementById('canvas-container');

            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);

            // Camera
            camera = new THREE.PerspectiveCamera(
                50,
                window.innerWidth / window.innerHeight,
                0.01,
                100
            );
            camera.position.set(0, 1, 3);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.target.set(0, 0.9, 0);
            controls.update();

            // Grid
            const gridHelper = new THREE.GridHelper(4, 20, 0x333333, 0x222222);
            scene.add(gridHelper);

            // Ambient light
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            // Handle resize
            window.addEventListener('resize', onWindowResize);

            // Setup drag and drop
            setupDragDrop();

            // Start render loop
            animate();
        }

        function setupDragDrop() {
            const body = document.body;

            body.addEventListener('dragover', (e) => {
                e.preventDefault();
                body.classList.add('drag-over');
            });

            body.addEventListener('dragleave', (e) => {
                e.preventDefault();
                body.classList.remove('drag-over');
            });

            body.addEventListener('drop', (e) => {
                e.preventDefault();
                body.classList.remove('drag-over');

                const file = e.dataTransfer.files[0];
                if (file && file.name.endsWith('.json')) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            const data = JSON.parse(event.target.result);
                            buildSkeleton(data, file.name);
                        } catch (err) {
                            console.error('Failed to parse JSON:', err);
                            alert('Failed to parse JSON file');
                        }
                    };
                    reader.readAsText(file);
                }
            });
        }

        async function loadSkeleton(url) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                const filename = url.split('/').pop();
                buildSkeleton(data, filename);
            } catch (err) {
                console.error('Failed to load skeleton:', err);
                alert(`Failed to load: ${url}\n${err.message}`);
            }
        }

        function buildSkeleton(data, filename) {
            // Remove existing skeleton
            if (skeletonGroup) {
                scene.remove(skeletonGroup);
                skeletonGroup.traverse((obj) => {
                    if (obj.geometry) obj.geometry.dispose();
                    if (obj.material) obj.material.dispose();
                });
            }

            // Hide drop zone
            document.getElementById('drop-zone').classList.add('hidden');
            document.getElementById('filename').textContent = filename || '';

            // Clear head circles from previous skeleton
            headCircles = [];

            skeletonGroup = new THREE.Group();

            const bones = data.bones;
            const boneColors = data.bone_colors;

            // Handle different JSON format versions
            // v1.1: people is array of {keypoints, cam_t}
            // v1.0: people is array of keypoints arrays (or single keypoints array)
            let peopleData = [];
            if (data.people && data.people.length > 0) {
                if (Array.isArray(data.people[0]) || (data.people[0].keypoints === undefined)) {
                    // v1.0 format: people is array of keypoint arrays
                    peopleData = data.people.map(kps => ({
                        keypoints: Array.isArray(kps) ? kps : data.keypoints,
                        cam_t: [0, 0, 0]
                    }));
                } else {
                    // v1.1 format: people is array of {keypoints, cam_t}
                    peopleData = data.people;
                }
            } else if (data.keypoints) {
                // Legacy single-person format
                peopleData = [{ keypoints: data.keypoints, cam_t: [0, 0, 0] }];
            }

            // Transform keypoints: apply cam_t offset and convert coordinate system
            // CV convention: Y-down, Z-forward (into screen)
            // Three.js convention: Y-up, Z-toward viewer
            // Transform: x' = x, y' = -y, z' = -z
            const transformedPeople = peopleData.map(person => {
                const cam_t = person.cam_t || [0, 0, 0];
                const kps = person.keypoints.map(kp => [
                    kp[0] + cam_t[0],           // X stays same
                    -(kp[1] + cam_t[1]),        // Flip Y
                    -(kp[2] + cam_t[2])         // Flip Z (depth)
                ]);

                // Compute virtual midpoints for cleaner stick figure
                // Keypoint indices: 5=left_shoulder, 6=right_shoulder, 9=left_hip, 10=right_hip, 3=left_ear, 4=right_ear
                const midHip = [
                    (kps[9][0] + kps[10][0]) / 2,
                    (kps[9][1] + kps[10][1]) / 2,
                    (kps[9][2] + kps[10][2]) / 2
                ];
                const midShoulder = [
                    (kps[5][0] + kps[6][0]) / 2,
                    (kps[5][1] + kps[6][1]) / 2,
                    (kps[5][2] + kps[6][2]) / 2
                ];
                const head = [
                    (kps[3][0] + kps[4][0]) / 2,
                    (kps[3][1] + kps[4][1]) / 2,
                    (kps[3][2] + kps[4][2]) / 2
                ];

                // Add virtual keypoints at end: 70=midHip, 71=midShoulder, 72=head
                kps.push(midHip, midShoulder, head);
                return kps;
            });

            // Virtual bone connections for spine/neck/head (indices 70, 71, 72)
            const virtualBones = [
                [70, 71, [51, 153, 255]],   // midHip -> midShoulder (spine)
                [71, 72, [51, 153, 255]],   // midShoulder -> head (neck)
                [72, 3, [51, 153, 255]],    // head -> left_ear
                [72, 4, [51, 153, 255]],    // head -> right_ear
            ];

            // Calculate global bounds across all transformed people
            let minX = Infinity, maxX = -Infinity;
            let minY = Infinity, maxY = -Infinity;
            let minZ = Infinity, maxZ = -Infinity;

            for (const keypoints of transformedPeople) {
                for (const kp of keypoints) {
                    if (kp[0] !== 0 || kp[1] !== 0 || kp[2] !== 0) {
                        minX = Math.min(minX, kp[0]);
                        maxX = Math.max(maxX, kp[0]);
                        minY = Math.min(minY, kp[1]);
                        maxY = Math.max(maxY, kp[1]);
                        minZ = Math.min(minZ, kp[2]);
                        maxZ = Math.max(maxZ, kp[2]);
                    }
                }
            }

            // Center of bounding box (for camera target)
            const centerX = (minX + maxX) / 2;
            const centerY = (minY + maxY) / 2;
            const centerZ = (minZ + maxZ) / 2;

            const height = maxY - minY || 1;
            const scale = 1.8 / height; // Target ~1.8 units tall

            // Create geometry templates
            // Regular joints and smaller hand/finger joints (0.25x size)
            const jointGeometry = new THREE.SphereGeometry(0.003, 6, 6);
            const handJointGeometry = new THREE.SphereGeometry(0.0015, 4, 4);
            const eyeJointGeometry = new THREE.SphereGeometry(0.005, 8, 8); // 2ishx regular size
            const jointMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });

            // Hand keypoint indices: 21-41 (right hand), 42-62 (left hand)
            const isHandJoint = (idx) => (idx >= 21 && idx <= 41) || (idx >= 42 && idx <= 62);
            // Eye keypoint indices: 1 (left_eye), 2 (right_eye)
            const isEyeJoint = (idx) => idx === 1 || idx === 2;
            // Extra keypoints to skip: 63-69 (olecranon, cubital fossa, acromion, neck)
            const isExtraJoint = (idx) => idx >= 63 && idx <= 69;

            // Build skeleton for each person
            for (const keypoints of transformedPeople) {
                // Create joints (small spheres, smaller for hands)
                for (let i = 0; i < keypoints.length; i++) {
                    const kp = keypoints[i];
                    // Skip if keypoint is at origin (invalid), virtual (70+), or extra (63-69)
                    if (i >= 70 || isExtraJoint(i) || (kp[0] === 0 && kp[1] === 0 && kp[2] === 0)) continue;

                    const geom = isEyeJoint(i) ? eyeJointGeometry : (isHandJoint(i) ? handJointGeometry : jointGeometry);
                    const joint = new THREE.Mesh(geom, jointMaterial);
                    joint.position.set(
                        (kp[0] - centerX) * scale,
                        (kp[1] - minY) * scale,
                        (kp[2] - centerZ) * scale
                    );
                    skeletonGroup.add(joint);
                }

                // Helper to transform a keypoint
                const transformPt = (kp) => new THREE.Vector3(
                    (kp[0] - centerX) * scale,
                    (kp[1] - minY) * scale,
                    (kp[2] - centerZ) * scale
                );

                // Helper to check if keypoint is valid
                const isValidKp = (kp) => kp && !(kp[0] === 0 && kp[1] === 0 && kp[2] === 0);

                // Create head circle (line geometry) at midpoint between ears
                const leftEye = keypoints[1];
                const headMid = keypoints[72]; // virtual midpoint between ears
                if (isValidKp(leftEye) && headMid) {
                    const headRadius = Math.sqrt(
                        Math.pow(headMid[0] - leftEye[0], 2) +
                        Math.pow(headMid[1] - leftEye[1], 2) +
                        Math.pow(headMid[2] - leftEye[2], 2)
                    ) * scale;

                    // Create circle from line segments
                    const segments = 32;
                    const circlePoints = [];
                    for (let i = 0; i <= segments; i++) {
                        const theta = (i / segments) * Math.PI * 2;
                        circlePoints.push(new THREE.Vector3(
                            Math.cos(theta) * headRadius,
                            Math.sin(theta) * headRadius,
                            0
                        ));
                    }

                    const circleGeometry = new THREE.BufferGeometry().setFromPoints(circlePoints);
                    const circleMaterial = new THREE.LineBasicMaterial({
                        color: new THREE.Color('rgb(51, 153, 255)')
                    });
                    const headCircle = new THREE.Line(circleGeometry, circleMaterial);
                    headCircle.position.set(
                        (headMid[0] - centerX) * scale,
                        (headMid[1] - minY) * scale,
                        (headMid[2] - centerZ) * scale
                    );

                    // Add filled sphere behind the outline (matches viewer background)
                    const fillGeometry = new THREE.SphereGeometry(headRadius * 0.97, 32, 32);
                    const fillMaterial = new THREE.MeshBasicMaterial({
                        color: 0x1a1a1a,
                        transparent: true,
                        opacity: 0.5,
                        depthWrite: false
                    });
                    const headFill = new THREE.Mesh(fillGeometry, fillMaterial);
                    headFill.position.copy(headCircle.position);
                    skeletonGroup.add(headFill);

                    skeletonGroup.add(headCircle);
                    headCircles.push(headCircle);
                }

                // Create foot polygons (transparent)
                // Left foot: ankle(13), big_toe(15), small_toe(16), heel(17)
                // Right foot: ankle(14), big_toe(18), small_toe(19), heel(20)
                const footIndices = [
                    { indices: [13, 15, 16, 17], color: [0, 255, 0] },      // left foot
                    { indices: [14, 18, 19, 20], color: [255, 128, 0] }     // right foot
                ];

                for (const foot of footIndices) {
                    const [ankleIdx, bigToeIdx, smallToeIdx, heelIdx] = foot.indices;
                    const pts = [keypoints[ankleIdx], keypoints[bigToeIdx], keypoints[smallToeIdx], keypoints[heelIdx]];

                    if (!pts.every(isValidKp)) continue;

                    const [ankle, bigToe, smallToe, heel] = pts.map(transformPt);

                    const geometry = new THREE.BufferGeometry();
                    const positions = [];
                    // Triangle 1: ankle, bigToe, heel
                    positions.push(ankle.x, ankle.y, ankle.z);
                    positions.push(bigToe.x, bigToe.y, bigToe.z);
                    positions.push(heel.x, heel.y, heel.z);
                    // Triangle 2: bigToe, smallToe, heel
                    positions.push(bigToe.x, bigToe.y, bigToe.z);
                    positions.push(smallToe.x, smallToe.y, smallToe.z);
                    positions.push(heel.x, heel.y, heel.z);
                    // Triangle 3: ankle, smallToe, bigToe
                    positions.push(ankle.x, ankle.y, ankle.z);
                    positions.push(smallToe.x, smallToe.y, smallToe.z);
                    positions.push(bigToe.x, bigToe.y, bigToe.z);
                    // Triangle 4: ankle, heel, smallToe (reversed winding for visibility)
                    positions.push(ankle.x, ankle.y, ankle.z);
                    positions.push(heel.x, heel.y, heel.z);
                    positions.push(smallToe.x, smallToe.y, smallToe.z);

                    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
                    geometry.computeVertexNormals();

                    const material = new THREE.MeshBasicMaterial({
                        color: new THREE.Color(`rgb(${foot.color[0]}, ${foot.color[1]}, ${foot.color[2]})`),
                        transparent: true,
                        opacity: 0.1,
                        depthWrite: false
                    });

                    skeletonGroup.add(new THREE.Mesh(geometry, material));
                }

                // Create hand palm polygons (transparent)
                // Left hand: wrist(62), thumb_third(45), thumb_second(44), index_third(49), middle_third(53), ring_third(57), pinky_third(61)
                // Right hand: wrist(41), thumb_third(24), thumb_second(23), index_third(28), middle_third(32), ring_third(36), pinky_third(40)
                const handIndices = [
                    { indices: [62, 45, 44, 49, 53, 57, 61], color: [0, 255, 0] },      // left hand
                    { indices: [41, 24, 23, 28, 32, 36, 40], color: [255, 128, 0] }     // right hand
                ];

                for (const hand of handIndices) {
                    const pts = hand.indices.map(i => keypoints[i]);

                    if (!pts.every(isValidKp)) continue;

                    const tPts = pts.map(transformPt);
                    const [wrist, thumbThird, thumbSecond, indexThird, middleThird, ringThird, pinkyThird] = tPts;

                    const geometry = new THREE.BufferGeometry();
                    const positions = [];
                    // Fan triangulation from wrist
                    // Triangle 1: wrist, thumbThird, thumbSecond
                    positions.push(wrist.x, wrist.y, wrist.z);
                    positions.push(thumbThird.x, thumbThird.y, thumbThird.z);
                    positions.push(thumbSecond.x, thumbSecond.y, thumbSecond.z);
                    // Triangle 2: wrist, thumbSecond, indexThird
                    positions.push(wrist.x, wrist.y, wrist.z);
                    positions.push(thumbSecond.x, thumbSecond.y, thumbSecond.z);
                    positions.push(indexThird.x, indexThird.y, indexThird.z);
                    // Triangle 3: wrist, indexThird, middleThird
                    positions.push(wrist.x, wrist.y, wrist.z);
                    positions.push(indexThird.x, indexThird.y, indexThird.z);
                    positions.push(middleThird.x, middleThird.y, middleThird.z);
                    // Triangle 4: wrist, middleThird, ringThird
                    positions.push(wrist.x, wrist.y, wrist.z);
                    positions.push(middleThird.x, middleThird.y, middleThird.z);
                    positions.push(ringThird.x, ringThird.y, ringThird.z);
                    // Triangle 5: wrist, ringThird, pinkyThird
                    positions.push(wrist.x, wrist.y, wrist.z);
                    positions.push(ringThird.x, ringThird.y, ringThird.z);
                    positions.push(pinkyThird.x, pinkyThird.y, pinkyThird.z);

                    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
                    geometry.computeVertexNormals();

                    const material = new THREE.MeshBasicMaterial({
                        color: new THREE.Color(`rgb(${hand.color[0]}, ${hand.color[1]}, ${hand.color[2]})`),
                        transparent: true,
                        opacity: 0.1,
                        side: THREE.DoubleSide,
                        depthWrite: false
                    });

                    skeletonGroup.add(new THREE.Mesh(geometry, material));
                }

                // Create bones (colored lines)
                // Combine regular bones with virtual bones (spine, neck, head)
                const allBones = [...bones.map((b, i) => [b[0], b[1], boneColors[i]]), ...virtualBones];

                for (const [startIdx, endIdx, color] of allBones) {
                    const startKp = keypoints[startIdx];
                    const endKp = keypoints[endIdx];

                    // Skip if either keypoint is invalid
                    if (!startKp || !endKp ||
                        (startKp[0] === 0 && startKp[1] === 0 && startKp[2] === 0) ||
                        (endKp[0] === 0 && endKp[1] === 0 && endKp[2] === 0)) {
                        continue;
                    }

                    const points = [
                        new THREE.Vector3(
                            (startKp[0] - centerX) * scale,
                            (startKp[1] - minY) * scale,
                            (startKp[2] - centerZ) * scale
                        ),
                        new THREE.Vector3(
                            (endKp[0] - centerX) * scale,
                            (endKp[1] - minY) * scale,
                            (endKp[2] - centerZ) * scale
                        )
                    ];

                    const geometry = new THREE.BufferGeometry().setFromPoints(points);

                    // Check if this is a foot bone (both endpoints in 13-20 range, not knee-to-ankle)
                    const isFootBone = (startIdx >= 13 && startIdx <= 20) && (endIdx >= 13 && endIdx <= 20);

                    const material = new THREE.LineBasicMaterial({
                        color: new THREE.Color(`rgb(${color[0]}, ${color[1]}, ${color[2]})`),
                        linewidth: 2,
                        transparent: isFootBone,
                        opacity: isFootBone ? 0.5 : 1.0
                    });
                    const line = new THREE.Line(geometry, material);
                    skeletonGroup.add(line);
                }
            }

            scene.add(skeletonGroup);

            // Apply camera state if provided in data
            if (data.camera_state) {
                const camState = data.camera_state;
                if (camState.position) {
                    camera.position.set(
                        camState.position.x || 0,
                        camState.position.y || 1,
                        camState.position.z || 3
                    );
                }
                if (camState.target) {
                    controls.target.set(
                        camState.target.x || 0,
                        camState.target.y || 1,
                        camState.target.z || 0
                    );
                }
            } else {
                // Default: Update camera target to skeleton center
                controls.target.set(0, height * scale * 0.5, 0);
            }
            controls.update();

            // Update info with person count
            const personCount = transformedPeople.length;
            document.getElementById('filename').textContent =
                `${filename || ''} (${personCount} ${personCount === 1 ? 'person' : 'people'})`;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            // Orient head circles to face camera
            for (const circle of headCircles) {
                circle.quaternion.copy(camera.quaternion);
            }

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
